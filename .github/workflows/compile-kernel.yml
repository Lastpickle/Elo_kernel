name: Compile RM6785 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      LC_ALL: C
      USE_CCACHE: 1
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLANG_REPO: "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git"
      ANYKERNEL_REPO: "https://github.com/elohim-etz/AK3.git"
      ANYKERNEL_BRANCH: "mikuchan"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
            libssl-dev gcc clang lld libncurses5-dev git zip curl time

      - name: Clone Clang toolchain
        run: |
          if [ ! -d "clang" ]; then
            echo "Cloning Clang..."
            git clone --depth=1 "$CLANG_REPO" clang
          else
            echo "Clang already exists, skipping clone."
          fi

      - name: Build Kernel
        id: build_kernel
        run: |
          set -e
          echo "Starting kernel build..."
          start_time=$(date +%s)

          mkdir -p out
          make O=out ARCH=${ARCH} RM6785_defconfig
          
          PATH="${PWD}/clang/bin:${PATH}" \
          make -j$(nproc) O=out \
                CC="clang" \
                LLVM=1 \
                CONFIG_NO_ERROR_ON_MISMATCH=y

          end_time=$(date +%s)
          build_duration=$((end_time - start_time))

          echo "BUILD_DURATION=${build_duration}" >> $GITHUB_ENV
          echo "Build finished in ${build_duration}s."

      - name: Check build output
        id: check_output
        run: |
          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Error: Image.gz not found! Build failed."
            exit 1
          fi

      - name: Package with AnyKernel3
        id: zip_kernel
        run: |
          echo "Zipping kernel..."
          rm -rf AnyKernel
          git clone --depth=1 "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH" AnyKernel
          TANGGAL=$(date +"%Y%m%d-%H")
          cp out/arch/arm64/boot/Image.gz AnyKernel/
          cd AnyKernel
          zip_name="Miku-RM6785-${TANGGAL}.zip"
          zip -r9 "$zip_name" *
          echo "ZIP_NAME=$zip_name" >> $GITHUB_ENV
          echo "KERNEL_ZIP=$(pwd)/$zip_name" >> $GITHUB_ENV
          cd ..

      - name: Gather system stats
        id: stats
        run: |
          total_space=$(df -h . | awk 'NR==2 {print $2}')
          used_space=$(df -h . | awk 'NR==2 {print $3}')
          available_space=$(df -h . | awk 'NR==2 {print $4}')
          mem_used=$(free -h | awk '/Mem:/ {print $3 "/" $2}')
          zip_size=$(du -h "$KERNEL_ZIP" | cut -f1)

          echo "TOTAL_SPACE=$total_space" >> $GITHUB_ENV
          echo "USED_SPACE=$used_space" >> $GITHUB_ENV
          echo "AVAILABLE_SPACE=$available_space" >> $GITHUB_ENV
          echo "MEM_USED=$mem_used" >> $GITHUB_ENV
          echo "ZIP_SIZE=$zip_size" >> $GITHUB_ENV

      - name: Send Success Report to Telegram
        if: success()
        run: |
          duration_min=$((BUILD_DURATION / 60))
          job_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          NL=$'\n'
          message="✅ *Kernel Build Successful!*${NL}${NL}*Device:* RM6785${NL}*Duration:* ${duration_min} min${NL}*Zip Size:* ${ZIP_SIZE}${NL}*Used Space:* ${USED_SPACE} / ${TOTAL_SPACE}${NL}*Memory Used:* ${MEM_USED}${NL}${NL}_Job:_ [View Logs](${job_url})"

          curl -s -F chat_id="${TELEGRAM_CHAT_ID}" \
               -F parse_mode="Markdown" \
               -F caption="$message" \
               -F document=@"$KERNEL_ZIP" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"

      - name: Send Failure Report to Telegram
        if: failure()
        run: |
          job_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          NL=$'\n'
          message="❌ *Kernel Build Failed!*${NL}${NL}*Repo:* ${{ github.repository }}${NL}*Branch:* ${{ github.ref_name }}${NL}${NL}_Job:_ [View Logs](${job_url})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d chat_id="${TELEGRAM_CHAT_ID}" \
               -d parse_mode="Markdown" \
               -d text="$message"
