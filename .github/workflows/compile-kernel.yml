name: Compile RM6785 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      LC_ALL: C
      USE_CCACHE: 1
      # TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLANG_REPO: "https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git"
      ANYKERNEL_REPO: "https://github.com/Lastpickle/AK3.git"
      ANYKERNEL_BRANCH: "takoyaki"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
            libssl-dev gcc clang lld libncurses5-dev git zip curl time

      - name: Clone Clang toolchain
        run: |
          if [ ! -d "clang" ]; then
            echo "Cloning Clang..."
            git clone --depth=1 "$CLANG_REPO" clang
          else
            echo "Clang already exists, skipping clone."
          fi

      - name: Setup SukiSU
        run: |
          if [ ! -d "KernelSU" ]; then
            echo "Setting up ksuN..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          else
            echo "Skipping..."
          fi

      - name: Patch SusFS
        run: |
          # Apply New SusFS KSUN Patch
          cd KernelSU-Next
          curl -Ls https://raw.githubusercontent.com/TheSillyOk/kernel_ls_patches/0b1717876eb05bbb06f02ed96deb3addda7d9b2a/KSUN/KSUN-SUSFS-1.5.9.patch | patch -p1 -F 3
          curl -Ls https://github.com/sidex15/KernelSU-Next/commit/effdc4fc06820afde70dd1b5e94658304efdb2ab.patch | patch -p1 -F 3
          curl -Ls https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/next/susfs_fix_patches/v1.5.9/fix_apk_sign.c.patch | sed '3,11d' | patch -p1 -F 3
          curl -Ls https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/next/susfs_fix_patches/v1.5.9/fix_kernel_compat.c.patch | patch -p1 -F 3


      - name: Build Kernel
        id: build_kernel
        run: |
          export KBUILD_BUILD_USER="Attack_Helicopter"
          export KBUILD_BUILD_HOST="BystanderforU" 
          set -e
          echo "Starting kernel build..."
          start_time=$(date +%s)

          mkdir -p out
          make O=out ARCH=${ARCH} RM6785_defconfig

          PATH="${PWD}/clang/bin:${PATH}" \
          make -j$(nproc) O=out \
                CC="clang" \
                LLVM=1 \
                CONFIG_NO_ERROR_ON_MISMATCH=y

          end_time=$(date +%s)
          build_duration=$((end_time - start_time))

          echo "BUILD_DURATION=${build_duration}" >> $GITHUB_ENV
          echo "Build finished in ${build_duration}s."

      - name: Check build output
        id: check_output
        run: |
          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Error: Image.gz not found! Build failed."
            exit 1
          fi

      - name: Package with AnyKernel3
        id: zip_kernel
        run: |
          echo "Zipping kernel..."
          rm -rf AnyKernel
          git clone --depth=1 "$ANYKERNEL_REPO" -b "$ANYKERNEL_BRANCH" AnyKernel
          TANGGAL=$(date +"%Y%m%d-%H")
          cp out/arch/arm64/boot/Image.gz AnyKernel/
          cd AnyKernel
          zip_name="Miku-RM6785-${TANGGAL}.zip"
          zip -r9 "$zip_name" *
          echo "ZIP_NAME=$zip_name" >> $GITHUB_ENV
          echo "KERNEL_ZIP=$(pwd)/$zip_name" >> $GITHUB_ENV
          cd ..

      - name: Gather system stats
        id: stats
        run: |
          total_space=$(df -h . | awk 'NR==2 {print $2}')
          used_space=$(df -h . | awk 'NR==2 {print $3}')
          available_space=$(df -h . | awk 'NR==2 {print $4}')
          mem_used=$(free -h | awk '/Mem:/ {print $3 "/" $2}')
          zip_size=$(du -h "$KERNEL_ZIP" | cut -f1)

          echo "TOTAL_SPACE=$total_space" >> $GITHUB_ENV
          echo "USED_SPACE=$used_space" >> $GITHUB_ENV
          echo "AVAILABLE_SPACE=$available_space" >> $GITHUB_ENV
          echo "MEM_USED=$mem_used" >> $GITHUB_ENV
          echo "ZIP_SIZE=$zip_size" >> $GITHUB_ENV
